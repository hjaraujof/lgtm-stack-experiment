# Default values for the lgtm-stack chart.
#
# These defaults describe the LOCAL cluster. Use values-kind.yaml for a kind cluster and
# values-eks.yaml for EKS. Both files only state their differences from this one.
#
# ---------------------------------------------------------------------------------------
# READ THIS BEFORE YOU RENAME ANYTHING.
#
# The Service names loki, tempo, mimir, grafana and otel-collector are FIXED. They are not
# derived from the release name, and there is no fullnameOverride. The reason is in
# config/: every config file already addresses its neighbours by those exact names
# (`http://mimir:9009/api/v1/push`, `targets: ['loki:3100']`). Docker Compose resolves a
# service name; Kubernetes resolves a Service name. Keeping the names identical is what
# lets ONE set of config files serve both planes with no edit.
#
# The cost is stated plainly: two releases of this chart cannot share a namespace. That is
# the trade accepted here, and it is the right one for a single observability stack.
# ---------------------------------------------------------------------------------------

nameOverride: ""

# Common labels added to every object.
commonLabels: {}

images:
  # Keep every tag in step with docker-compose.yml. Two planes running different builds of
  # the same config is exactly the drift this repository exists to remove.
  loki: grafana/loki:3.7.3
  tempo: grafana/tempo:3.0.2
  mimir: grafana/mimir:3.1.2
  grafana: grafana/grafana:12.3.0
  collector: otel/opentelemetry-collector-contrib:0.142.0
  minio: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
  mc: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
  # Toolchain image for the two init jobs. Built from scripts/Dockerfile.grafana-init in
  # the Compose plane; here it must be a pushed image, because a cluster cannot build.
  # See k8s/README.md for the one-line build-and-load step on kind.
  initTools: lgtm-init-tools:local
  pullPolicy: IfNotPresent

# ==========================================================================================
# Object storage
# ==========================================================================================
# Tempo and Mimir already speak S3 in config/. MinIO is an S3 server, so the cluster
# changes only the endpoint, the bucket and two flags. The S3 code path is then the same
# code path locally and on AWS, which is the whole point of running MinIO instead of
# switching both backends to a filesystem directory.
minio:
  enabled: true
  # The Secret holding rootUser and rootPassword. THIS CHART DOES NOT CREATE IT.
  # See the note under s3Credentials below.
  credentialsSecret: minio-credentials
  buckets:
    - lgtm-traces
    - lgtm-metrics
  persistence:
    size: 20Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# ==========================================================================================
# SECRETS: THIS CHART CREATES NONE OF THEM. READ THIS BEFORE YOU ADD ONE.
# ==========================================================================================
# Every Secret below is referenced BY NAME and must already exist in the namespace. The
# chart holds no password, so no password reaches git, a values file, a CI log, or
# `helm get values`.
#
# THE RANKING THAT DECIDES WHICH MECHANISM TO USE, worst to best:
#   1. a literal in values.yaml, committed              never
#   2. `kubectl create secret` by hand                  no secret in git, but nothing
#                                                       reproducible, no rotation, no audit
#   3. SOPS or Sealed Secrets                           an ENCRYPTED blob is safe in git
#   4. External Secrets Operator / Secrets Store CSI    the external store is the truth and
#                                                       the Secret is a refreshing copy
#   5. IRSA or workload identity, no credential at all  nothing to leak, nothing to rotate
#
# TWO FACTS DECIDE THE TIER. A Kubernetes Secret is base64, not encryption - anyone with
# `get secrets` in this namespace reads the value. And a secret a human types once is a
# secret nobody rotates.
#
# WHERE THIS CHART SITS:
#   Tempo and Mimir against S3   tier 5. See s3Credentials below.
#   Grafana on EKS               tier 4, through externalSecrets below.
#   MinIO root on kind           tier 2, correctly - it is a local throwaway. The values are
#                                GENERATED by k8s/scripts/create-secrets.sh, never written
#                                down, because a shipped default password is a real one on
#                                the day somebody copies this chart to a real cluster.

# The S3 identity for Tempo and Mimir, as AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
#
# WHY ENVIRONMENT VARIABLES AND NOT THE CONFIG FILE. Both backends use the same S3 client,
# and that client falls back to the standard AWS credential chain when access_key_id is
# empty in the config. The chain reads these two variables. So the config file states WHERE
# the bucket is and never states WHO is calling, and the identical file works with a MinIO
# key locally and with an IRSA web-identity token on EKS.
s3Credentials:
  # enabled=false means "an identity already exists and needs no variable" - IRSA on EKS.
  # That is the tier-5 case: no key is injected because no key exists.
  enabled: true
  secretName: lgtm-s3-credentials

# Secrets Store CSI driver with the AWS provider. Off locally, on for EKS.
#
# WHAT IT DOES AND WHY IT BEATS A KUBERNETES SECRET. The driver reads AWS Secrets Manager
# using the pod's IRSA identity and mounts each value as a FILE in the pod. No Kubernetes
# Secret object is created, so the password never enters etcd and `kubectl get secret` in
# this namespace reveals nothing. It is the same boot-fetch that user_data.tpl performs on
# EC2, with the same secret path, so one rotation reaches both deployment planes.
#
# GRAFANA READS A FILE IN BOTH PLANES, and that symmetry is deliberate. Every GF_ variable
# accepts a __FILE suffix that names a path instead of holding a value. Locally the file
# comes from a Secret volume; on EKS it comes from the CSI mount. The container's
# configuration is identical, so the local cluster exercises the real mechanism.
#
# THE DRIVER IS NOT INSTALLED BY THIS CHART. Without it, the SecretProviderClass object is
# rejected with "no matches for kind" - a missing controller, not a broken template.
secretsStore:
  enabled: false
  # Secrets Manager path. A placeholder, like every identifier in this repository. It is
  # the SAME path that user_data.tpl reads at boot.
  remoteSecret: /example/dev/lgtm-stack
  # JMES paths into that JSON secret, one file each.
  keys:
    adminPassword: default_grafana_admin_password
    defaultAdminPassword: default_admin_password
    defaultMemberPassword: default_member_password

# ==========================================================================================
# Config overrides
# ==========================================================================================
# HOW THIS WORKS, AND WHY IT IS NOT A SECOND COPY OF THE CONFIG.
#
# Each backend ConfigMap loads the real file from files/ (a synced copy of config/). If the
# matching configOverride below is EMPTY, the file is embedded BYTE FOR BYTE, comments and
# all. If it is not empty, the chart parses the file, deep-merges the override, and emits
# the result - which loses the comments in the ConfigMap but not in the source file.
#
# Verbatim is therefore the default, and a patch is a deliberate, visible act. Run
# `helm template` to see exactly what a pod will read.
loki:
  # Loki stays on the filesystem backend, deliberately. Moving it to S3 is NOT a config
  # edit: config/loki-config.yaml explains at length that Loki does not migrate data across
  # a store change, and that the supported move adds a NEW schema period with a FUTURE
  # `from:` date. That is a dated deploy requirement, not a chart value.
  configOverride: {}
  persistence:
    size: 20Gi
    storageClass: ""
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 2Gi }

tempo:
  configOverride:
    storage:
      trace:
        s3:
          bucket: lgtm-traces
          endpoint: minio:9000
          region: us-east-1
          # http, not https. MinIO here serves plain HTTP inside the cluster.
          insecure: true
          # MinIO addresses a bucket by path (minio:9000/lgtm-traces). AWS addresses it by
          # host. Leave this false against real S3.
          forcepathstyle: true
  persistence:
    size: 20Gi
    storageClass: ""
  resources:
    requests: { cpu: 200m, memory: 1Gi }
    limits: { memory: 4Gi }

mimir:
  configOverride:
    common:
      storage:
        s3:
          endpoint: minio:9000
          region: us-east-1
          bucket_name: lgtm-metrics
          insecure: true
          bucket_lookup_type: path
    alertmanager_storage:
      s3:
        endpoint: minio:9000
        region: us-east-1
        bucket_name: lgtm-metrics
        insecure: true
        bucket_lookup_type: path
  # `all` is monolithic mode. alertmanager is not part of `all` and must be named.
  target: all,alertmanager
  persistence:
    size: 30Gi
    storageClass: ""
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { memory: 6Gi }
  # The Alertmanager tenant config cannot be mounted: it lives on object storage so the
  # Alertmanager keeps its own silences and notification log. A reconciler pushes it
  # through the config API instead, and reverts an out-of-band write within one interval.
  alertmanagerReconciler:
    enabled: true
    tenant: demo
    intervalSecs: 60

grafana:
  adminUser: admin
  # THE PASSWORD IS NEVER A VALUE HERE, IN EITHER PLANE. Grafana reads it from a FILE,
  # through the __FILE suffix that every GF_ variable accepts. Only the source of that file
  # differs: a Secret volume locally, a Secrets Store CSI mount on EKS. Because the
  # container configuration is identical, the local cluster exercises the real mechanism
  # rather than a simplified stand-in.
  #
  # The Secret named here is NOT created by this chart. Locally, generate it:
  #   k8s/scripts/create-secrets.sh
  credentialsSecret: grafana-admin
  rootUrl: ""
  persistence:
    size: 10Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  # ONE TIER ABOVE ANY SECRET STORE: DELETE THE CREDENTIAL.
  #
  # A Grafana admin password exists only because the local login form exists. Point Grafana
  # at an identity provider (IAM Identity Center, Okta, Entra) and disable the form, and
  # there is no password to store, mount, rotate or leak. The built-in admin then survives
  # only as break-glass, reachable through the CSI mount.
  #
  # This is off by default because it needs an identity provider that this repository, being
  # org-agnostic, cannot supply. It is the right target, not an optional extra.
  auth:
    oauth:
      enabled: false
      # Rendered into GF_AUTH_GENERIC_OAUTH_* variables. The client secret is NOT set here:
      # it is read from the same credentials volume, key oauth-client-secret.
      name: SSO
      clientId: ""
      authUrl: ""
      tokenUrl: ""
      apiUrl: ""
      scopes: "openid profile email"
      # Once SSO works, set this true. Until then a locked-out cluster is one typo away.
      disableLoginForm: false
  # The one-shot user and team provisioner, run as a Helm post-install hook. It calls the
  # Grafana HTTP API, so it must run AFTER Grafana answers - which is what the hook weight
  # and the script's own poll give it.
  #
  # IT IS REDUNDANT UNDER SSO. An identity provider that already knows who your engineers
  # are should create them, not a JSON file in this repository. Leave this off unless you
  # run local accounts.
  init:
    enabled: false

collector:
  # ONE REPLICA, AND THE REASON MATTERS. tail_sampling is stateful: it buffers every span
  # of a trace until it can decide. Two replicas behind one Service split a trace's spans
  # across two buffers, and each pod then samples a partial trace. Scaling this safely
  # needs a load-balancing exporter in front, keyed on trace ID. Until that exists, one.
  replicas: 1
  queue:
    size: 10Gi
    storageClass: ""
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 6Gi }
  # These three move together. The memory_limiter processor's limit_percentage resolves
  # against the cgroup limit above, exactly as it resolves against mem_limit in Compose.
  env:
    GOMEMLIMIT: 5200MiB
    GOGC: "400"
  # The hostmetrics DaemonSet. This is the one pipeline that CANNOT stay with the gateway:
  # a gateway pod runs on one node and would report one node's CPU as the cluster's.
  agent:
    enabled: true
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }

# ==========================================================================================
# Ingress
# ==========================================================================================
# This replaces the nginx + certbot pair and the four scripts behind them. An Ingress plus
# a cert-manager annotation is the whole of it.
ingress:
  enabled: true
  className: nginx
  host: grafana.localtest.me
  tls:
    enabled: true
    secretName: grafana-tls
    # selfsigned on kind, letsencrypt-prod on EKS.
    clusterIssuer: selfsigned
    # Create the ClusterIssuer object as part of this release. True on kind, where a
    # self-signed issuer is the only option. False on EKS, where the Let's Encrypt issuer
    # is a cluster-wide object with an ACME account behind it and belongs to whoever
    # installs cert-manager, not to this release.
    createIssuer: false
  annotations: {}

# OTLP ingress for producers OUTSIDE the cluster. In-cluster producers use the Service DNS
# name otel-collector.<namespace>.svc.cluster.local and need none of this.
otlpService:
  # ClusterIP, LoadBalancer or NodePort.
  type: ClusterIP
  annotations: {}

serviceAccount:
  create: true
  # Set to a role ARN on EKS to enable IRSA.
  annotations: {}

# Optional. Denies every pod-to-pod flow that is not in the mapping table in k8s/README.md.
networkPolicy:
  enabled: false
