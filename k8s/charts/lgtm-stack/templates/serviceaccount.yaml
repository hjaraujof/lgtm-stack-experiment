{{- if .Values.serviceAccount.create }}
{{/*
One ServiceAccount for the whole stack.

ITS ONLY JOB HERE IS AWS IDENTITY. Nothing in this chart calls the Kubernetes API, so the
account is bound to no Role and no ClusterRole. On EKS, values-eks.yaml annotates it with
eks.amazonaws.com/role-arn and the EKS webhook then projects a web-identity token into
every pod that uses it. The AWS credential chain in Tempo and Mimir finds that token by
itself - which is why their config files name a bucket and never name a caller, and why the
same file works against MinIO with a key and against S3 with a role.

A tighter setup gives Tempo and Mimir one account each, so the trace role cannot read the
metrics bucket. That is the right next step and it is deliberately not taken here: one
account keeps the IRSA mechanism visible without four more objects around it.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lgtm.serviceAccountName" . }}
  labels:
    {{- include "lgtm.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
