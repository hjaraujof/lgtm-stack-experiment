# Initial HTTP-only configuration for Let's Encrypt certificate acquisition
# This config is used before SSL certificates are obtained
# After certbot succeeds, this is replaced with grafana.conf (SSL-enabled)

server {
    listen 80;
    server_name grafana.example.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy to Grafana (HTTP until SSL is configured)
    location / {
        # Per-request re-resolution via Docker's embedded DNS. See grafana.conf.template for the
        # full rationale. A SECOND benefit that matters here: because a variable in proxy_pass
        # defers resolution to REQUEST time, `nginx -t` no longer has to resolve `grafana` at
        # config-load — so this file can be syntax-checked in CI, where no such host exists. A
        # literal `proxy_pass http://grafana:3000` fails validation with "host not found in
        # upstream", which is the wrong reason for a red build.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $grafana_upstream grafana;
        proxy_pass http://$grafana_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
